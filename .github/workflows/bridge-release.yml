# Pegasus Bridge releases. Publish a release on GitHub with a tag like bridge-v0.4.1 (Releases →
# Draft a new release → choose a tag → type bridge-v<version> → Create new tag → Publish); this
# builds uc-intg-pegasus-bridge-<version>.tar.gz from that tag and attaches it to the release.
# The tag's version must match bridge/src/driver.json.
name: Bridge release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bridge:
    if: startsWith(github.event.release.tag_name, 'bridge-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag and driver.json agree
        run: |
          want="${{ github.event.release.tag_name }}"; want="${want#bridge-v}"
          have=$(node -p "require('./bridge/src/driver.json').version")
          echo "tag $want, driver.json $have"
          [ "$want" = "$have" ] || { echo "::error::the tag says $want but bridge/src/driver.json says $have"; exit 1; }
      - name: Tests
        run: npm install --no-audit --no-fund && (cd hub && npm ci --no-audit --no-fund) && (cd bridge/src/bin && npm ci --no-audit --no-fund) && npm test
      - run: sh bridge/build.sh
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" bridge/dist/*.tar.gz --clobber
