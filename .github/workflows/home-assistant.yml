# Checks the Home Assistant parts: the Pegasus integration (custom_components/pegasus, installed
# with HACS) with Home Assistant's own hassfest and HACS's validation, the add-on (pegasus_hub/)
# with the add-on linter, and the integration's tests against real demo hubs.
name: Home Assistant

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brand images and repository description/topics are set on GitHub, not in the code
          ignore: brands description topics

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./pegasus_hub

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: cd hub && npm ci --no-audit --no-fund
      - run: pip install pytest-homeassistant-custom-component
      - name: Start the demo hubs
        run: |
          node tests_ha/demo-hubs.mjs > hubs.log 2>&1 &
          for i in $(seq 1 120); do grep -q ready hubs.log && break; sleep 3; done
          cat hubs.log
      - run: python -m pytest -v
