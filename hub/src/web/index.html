<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pegasus Hub</title>
<script>
// apply the saved theme before anything paints (no flash of the wrong theme)
(function () {
  var t = "system", a = "indigo";
  try { t = localStorage.getItem("pg-theme") || t; a = localStorage.getItem("pg-accent") || a; } catch (e) {}
  var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = t === "system" ? (dark ? "dark" : "light") : t;
  document.documentElement.dataset.accent = a;
})();
</script>
<style>
:root,:root[data-theme="light"]{
  --bg:#f3f4f7;--panel:#fff;--panel2:#f8f9fb;--ink:#151821;--mute:#646b7a;--faint:#9aa0ad;--line:#e3e6ec;
  --ok:#23864a;--ok-soft:#e5f5ec;--warn:#b86400;--warn-soft:#fff2df;--bad:#c33030;--bad-soft:#fde8e8;--idle:#6b7280;--idle-soft:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);--logbg:#0c0e12;--logink:#cfd5df;--scrim:rgba(10,12,18,.5);
  --in:#2f9e8f;--out:#c2731b;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a21;--panel2:#1c2029;--ink:#e7e9ee;--mute:#9aa1af;--faint:#6b7280;--line:#272c36;
  --ok:#4cc97a;--ok-soft:#163222;--warn:#f0a548;--warn-soft:#352610;--bad:#ff7070;--bad-soft:#3a1717;--idle:#9aa1af;--idle-soft:#232731;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--logbg:#0a0c10;--logink:#cfd5df;--scrim:rgba(0,0,0,.6);
  --in:#4fd1bd;--out:#f2a65a;
  color-scheme:dark;
}
:root[data-theme="midnight"]{
  --bg:#000;--panel:#0b0b0e;--panel2:#121217;--ink:#ececf1;--mute:#8e8e9c;--faint:#5c5c68;--line:#1f1f27;
  --ok:#3fd17a;--ok-soft:#0f2a19;--warn:#ffb347;--warn-soft:#2c1f08;--bad:#ff6b6b;--bad-soft:#2e0f0f;--idle:#8e8e9c;--idle-soft:#17171d;
  --shadow:none;--logbg:#050507;--logink:#d2d2dc;--scrim:rgba(0,0,0,.7);
  --in:#4fd1bd;--out:#f2a65a;
  color-scheme:dark;
}
:root[data-theme="slate"]{
  --bg:#1b2230;--panel:#232c3d;--panel2:#2a3447;--ink:#e3e8f2;--mute:#9eabc2;--faint:#6d7a92;--line:#34405a;
  --ok:#5fd394;--ok-soft:#1d3a30;--warn:#f4b45f;--warn-soft:#3d3020;--bad:#ff8080;--bad-soft:#432528;--idle:#9eabc2;--idle-soft:#2f3a50;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.2);--logbg:#141a25;--logink:#d6deeb;--scrim:rgba(8,12,20,.6);
  --in:#6fdcc9;--out:#f5b26b;
  color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#f4efe6;--panel:#fffcf6;--panel2:#f9f4ea;--ink:#2a2420;--mute:#6f655a;--faint:#a3988a;--line:#e5dccd;
  --ok:#2f7d46;--ok-soft:#e3f0e2;--warn:#a85f00;--warn-soft:#f8ead2;--bad:#b3392c;--bad-soft:#f6e1dc;--idle:#7b7064;--idle-soft:#efe8dc;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.06);--logbg:#211c17;--logink:#e9e1d3;--scrim:rgba(40,30,20,.45);
  --in:#2a8c7e;--out:#b8681a;
  color-scheme:light;
}
:root[data-theme="contrast"]{
  --bg:#000;--panel:#000;--panel2:#111;--ink:#fff;--mute:#e0e0e0;--faint:#bdbdbd;--line:#fff;
  --ok:#5dff8f;--ok-soft:#002a10;--warn:#ffd23f;--warn-soft:#2a2200;--bad:#ff6b6b;--bad-soft:#2a0000;--idle:#fff;--idle-soft:#1a1a1a;
  --shadow:none;--logbg:#000;--logink:#fff;--scrim:rgba(0,0,0,.8);
  --in:#5dffe0;--out:#ffb15d;
  color-scheme:dark;
}
/* accents: [light-theme value, dark-theme value] picked by the --lum switch below */
:root{--accent:#4c5fd5;--accent-ink:#fff;--accent-soft:#eceffd}
:root[data-accent="indigo"]{--a1:#4c5fd5;--a2:#8597ff}
:root[data-accent="teal"]{--a1:#0f8b7e;--a2:#3fd3c1}
:root[data-accent="violet"]{--a1:#7a46d6;--a2:#b391ff}
:root[data-accent="orange"]{--a1:#c4590f;--a2:#ff9d52}
:root[data-accent="rose"]{--a1:#c4335f;--a2:#ff7aa2}
:root[data-accent="green"]{--a1:#2d8a3e;--a2:#68d97b}
:root[data-theme="light"],:root[data-theme="paper"]{--accent:var(--a1);--accent-ink:#fff;--accent-soft:color-mix(in srgb,var(--a1) 11%,var(--panel))}
:root[data-theme="dark"],:root[data-theme="midnight"],:root[data-theme="slate"],:root[data-theme="contrast"]{--accent:var(--a2);--accent-ink:#0b0d12;--accent-soft:color-mix(in srgb,var(--a2) 18%,var(--panel))}
:root{--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:12px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#c86cff));display:grid;place-items:center;color:#fff;flex:none}
.brand small{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:4px}
.remotes{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.rpill{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:99px;background:var(--panel2);font-size:12.5px;white-space:nowrap}
.rpill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.rpill.sleep .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rpill.off .dot{background:var(--faint);box-shadow:0 0 0 3px var(--idle-soft)}
.rpill .lat{font-family:var(--mono);color:var(--mute)}
.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent)}
@media (max-width:560px){.est th:nth-child(2),.est td:nth-child(2),.est th:nth-child(3),.est td:nth-child(3),.est th:nth-child(4),.est td:nth-child(4){display:none}}
/* guided tours */
.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--panel2)}
.tour-spot{position:fixed;z-index:1000;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,10,20,.55),0 0 0 3px var(--accent);pointer-events:none;transition:all .25s ease}
.tour-spot.none{box-shadow:0 0 0 9999px rgba(8,10,20,.55);width:0!important;height:0!important}
.tour-card{position:fixed;z-index:1001;width:min(360px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:16px 16px 12px;transition:top .25s ease,left .25s ease}
.tour-card h3{margin:0 0 6px;font-size:16px}
.tour-card p{margin:0 0 12px;color:var(--ink2,var(--ink));line-height:1.5;font-size:14px}
.tour-card .tf{display:flex;align-items:center;gap:8px}
.tour-card .tf .n{color:var(--mute);font-size:12px;margin-right:auto}
.tour-card .dots{display:flex;gap:4px;margin:0 0 10px}
.tour-card .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-card .dots i.on{background:var(--accent)}
.checklist{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:0 0 14px}
.checklist .ci{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px}
.checklist .ci .mk{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.checklist .ci.done .mk{background:var(--accent);border-color:var(--accent);color:#fff}
.checklist .ci.done b{text-decoration:line-through;opacity:.7}
.checklist .ci .sub2{margin:2px 0 6px}
@media (prefers-reduced-motion:reduce){.tour-spot,.tour-card{transition:none}}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 12px;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

main{max-width:1180px;margin:0 auto;padding:20px 20px 60px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
button.tile{cursor:pointer;display:block;width:100%;font:inherit;color:inherit}button.tile:hover{border-color:var(--accent)}
.tile .k{color:var(--mute);font-size:12px}
.tile .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:13px;color:var(--mute);font-weight:500}
.tile .bar{height:5px;border-radius:9px;background:var(--idle-soft);margin-top:8px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tile svg.spark{display:block;width:100%;height:22px;margin-top:4px}

/* cards & list */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card,#remoteSections .card{margin-top:16px}
.listhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listhead h2{margin:0;font-size:15px}
.listhead .sub2{margin:0}
.search{flex:1;min-width:160px;max-width:280px;margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--panel2);color:var(--mute)}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;padding:7px 0;width:100%;outline:none}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border:1px solid transparent;background:transparent;border-radius:99px;padding:4px 10px;font-size:12.5px;color:var(--mute)}
.filters button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.filters .n{opacity:.7;margin-left:3px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
.app{display:flex;align-items:center;gap:12px;min-width:0}
.aicon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px;font-weight:700}
.aname{font-weight:620;font-size:14.5px}
.asub{color:var(--mute);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.asub span{white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-running,.st-done{color:var(--ok);background:var(--ok-soft)}
.st-starting,.st-installing,.st-updating,.st-moving{color:var(--warn);background:var(--warn-soft)}
.st-starting::before,.st-moving::before{animation:pulse 1s infinite}
.st-crashed,.st-error,.st-failed{color:var(--bad);background:var(--bad-soft)}
.st-stopped,.st-idle{color:var(--idle);background:var(--idle-soft)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sub2{color:var(--mute);font-size:12px;margin-top:3px}
.rem{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.rem span{display:flex;align-items:center;gap:6px}
.ck{color:var(--ok)}.wt{color:var(--warn)}.xx{color:var(--faint)}.bd{color:var(--bad)}
.usage{font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.mini{display:inline-block;width:46px;height:4px;border-radius:9px;background:var(--idle-soft);vertical-align:middle;margin-left:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.upd{font-size:12.5px;white-space:nowrap}
.upd .new{color:var(--accent);font-weight:650}
.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow),0 10px 30px rgba(0,0,0,.15);min-width:200px;padding:5px;z-index:20;display:none}
.menu.open .menu-pop{display:block}
.menu-pop button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;gap:10px;align-items:center;font-size:13px}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu-pop .danger{color:var(--bad)}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}
.empty h3{color:var(--ink);margin:8px 0 4px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r);margin-bottom:14px;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner .btn{margin-left:auto}

/* remote sections */
.slots{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.slotbar{display:flex;gap:3px}
.slotbar i{width:9px;height:14px;border-radius:3px;background:var(--idle-soft);border:1px solid var(--line)}
.slotbar i.used{background:var(--accent);border-color:var(--accent)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .kind{font-size:12px;color:var(--mute)}
.rgroup{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:600;padding:12px 16px 4px;border-top:1px solid var(--line)}
.rgroup:first-child{border-top:0}
.mv{margin-top:8px;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow-wrap:anywhere}
.mv.failed{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.mv .what{margin:6px 0 0;color:var(--ink)}
.mv .acts{justify-content:flex-start;margin-top:10px;flex-wrap:wrap;align-items:center;white-space:normal}
.mv pre{margin:6px 0 0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mute);max-height:160px;overflow:auto}
.mv details summary{cursor:pointer;color:var(--mute);font-size:12px;margin-top:8px}
details.more>summary{cursor:pointer;color:var(--mute);font-size:12.5px;padding:10px 16px;border-top:1px solid var(--line);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";}
details.more[open]>summary::before{content:"▾ ";}

/* windows */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.scrim.open{display:flex}
.win{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column}
.win.wide{width:min(980px,100%)}
.win.narrow{width:min(480px,100%)}
.whead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.whead h3{margin:0;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whead .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:var(--mute);width:32px;height:32px;border-radius:8px;flex:none}
.whead .x:hover{background:var(--panel2)}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;border-bottom:2px solid transparent;color:var(--mute);font-weight:550;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.wbody{padding:16px 18px;overflow:auto}
.wfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.wfoot .left{margin-right:auto;color:var(--mute);font-size:12.5px;align-self:center}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .help{color:var(--mute);font-size:12px;margin-top:4px}
.inp{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea.inp{font-family:var(--mono);font-size:12.5px;min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .t{flex:1}.toggle .t b{display:block;font-size:13.5px}.toggle .t span{color:var(--mute);font-size:12.5px}
.sw{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin-top:2px;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--accent)}.sw:checked::after{left:19px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink)}
pre.log{margin:0;background:var(--logbg);color:var(--logink);border-radius:10px;padding:12px;font:12px/1.55 var(--mono);height:min(56vh,480px);overflow:auto;white-space:pre-wrap;word-break:break-word}
pre.log .e{color:#ff8a8a}pre.log .h{color:#8fa2ff}pre.log .ok{color:#6fdc98}
.logbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.logbar .inp{max-width:240px;padding:6px 10px}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute);white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pairbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);min-width:0}
.pairbox .k{font-size:12px;color:var(--mute)}
.pairbox .v{font:650 19px var(--mono);margin-top:4px;letter-spacing:.5px;word-break:break-all;user-select:all}
.copy{float:right;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
ol.howto{padding-left:20px;margin:14px 0 0}
ol.howto li{margin:6px 0}
.rtable td,.rtable th{padding:9px 8px}
.warnbox{background:var(--bad-soft);border-radius:10px;padding:12px 14px;font-size:13px;margin:10px 0}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kvs dt{color:var(--mute)}.kvs dd{margin:0;min-width:0;word-break:break-word}
.steps{margin:0 0 12px;padding-left:18px;color:var(--mute);font-size:13px}
.steps li{margin:4px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad);color:#fff}

/* theme popover */
.themepop{position:absolute;right:0;top:calc(100% + 6px);width:280px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow),0 12px 36px rgba(0,0,0,.2);padding:12px;z-index:30;display:none}
.menu.open .themepop{display:block}
.themepop h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.themes button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 8px;font-size:12.5px;text-align:left}
.themes button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sample{width:22px;height:16px;border-radius:4px;flex:none;border:1px solid rgba(127,127,127,.35);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.accents{display:flex;gap:8px;flex-wrap:wrap}
.accents button{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.accents button.on{box-shadow:0 0 0 2px var(--ink)}

/* network */
.netgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel2);min-width:0}
.stat .k{font-size:11.5px;color:var(--mute)}
.stat .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:12px;color:var(--mute);font-weight:500}
.chart{width:100%;height:auto;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:6px 2px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.nethead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nethead h4{margin:0;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--panel2);padding:5px 10px;font-size:12.5px;color:var(--mute)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.netsec+.netsec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tablewrap th,.tablewrap td{padding:8px 10px;font-size:12.5px}

/* phone layout */
@media (max-width:860px){
  .tiles,.netgrid{grid-template-columns:repeat(2,1fr)}
  .remotes{display:none}
  .top-in{padding:10px 14px;gap:8px}
  .brand{margin-right:auto}
  .brand small,.iconbtn .lbl{display:none}
  main{padding:16px 14px 50px}
  #intgTable thead{display:none}
  #intgTable,#intgTable tbody,#intgTable tr,#intgTable td{display:block;width:100%}
  #intgTable tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  #intgTable tr:last-child{border-bottom:0}
  #intgTable td{border:0;padding:4px 0}
  #intgTable td[data-l]{display:flex;gap:8px;align-items:flex-start}
  #intgTable td[data-l]::before{content:attr(data-l);flex:none;width:86px;color:var(--mute);font-size:12px;padding-top:2px}
  .acts{justify-content:flex-start;margin-top:6px;flex-wrap:wrap}
  .listhead .search{max-width:none;order:3;flex-basis:100%;margin-left:0}
  .pair,.row2{grid-template-columns:1fr}
  .rrow{grid-template-columns:minmax(0,1fr);padding:11px 14px}
  .themepop{position:fixed;left:14px;right:14px;top:58px;width:auto}
}
@media (max-width:520px){
  .netgrid{grid-template-columns:1fr}
  .scrim{padding:10px 8px}
  .win{max-height:calc(100vh - 20px)}
  .menu-pop{right:auto;left:0}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c3-1 5-4 6-8 1 3 3 5 6 5 2 0 3-1 4-3"/><path d="M14 4l2 3"/></svg></div>
      <div>Pegasus Hub<small id="ver"></small></div>
    </div>
    <div class="remotes" id="pills"></div>
    <button class="iconbtn" id="netBtn" title="Network statistics"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="lbl">Network</span></button>
    <button class="iconbtn" id="remotesBtn" title="Remotes and pairing"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M12 6v.01M10 10h4"/></svg><span class="lbl">Remotes</span></button>
    <div class="menu" id="helpMenu">
      <button class="iconbtn" id="helpBtn" title="Help and guided tours" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg><span class="lbl">Help</span></button>
      <div class="menu-pop" id="helpPop" role="menu">
        <div class="sub2" style="padding:6px 10px 4px;margin:0">Guided tours</div>
        <button class="mi" data-tour="start">Getting started: link a remote</button>
        <button class="mi" data-tour="add">Add an integration</button>
        <button class="mi" data-tour="move">Move an integration to the hub</button>
        <button class="mi" data-tour="dashboard">Find your way around</button>
        <div style="border-top:1px solid var(--line);margin:4px 0"></div>
        <a class="mi" href="https://github.com/Sat32blk/Pegasus#readme" target="_blank" rel="noopener">Documentation ↗</a>
        <a class="mi" href="https://github.com/Sat32blk/Pegasus/issues" target="_blank" rel="noopener">Report a problem ↗</a>
      </div>
    </div>
    <div class="menu" id="themeMenu">
      <button class="iconbtn" id="themeBtn" title="Theme" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.7 0 2-1.4 1.2-2.4-.8-1-.4-2.6 1.1-2.6H17a4 4 0 0 0 4-4c0-5-4-9-9-9z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></svg><span class="lbl">Theme</span></button>
      <div class="themepop" role="dialog" aria-label="Theme">
        <h4>Theme</h4>
        <div class="themes" id="themes"></div>
        <h4>Accent</h4>
        <div class="accents" id="accents"></div>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="banner"></div>
  <div id="checklist"></div>
  <section class="tiles" id="tiles"></section>

  <section class="card">
    <div class="listhead">
      <h2>Integrations on the hub</h2>
      <div class="filters" id="filters"></div>
      <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search" aria-label="Search integrations"></div>
      <button class="btn" id="checkUpd">Check for updates</button>
      <button class="btn primary" id="addBtn">+ Add integration</button>
    </div>
    <div id="listWrap"><div class="empty">Loading…</div></div>
  </section>

  <div id="remoteSections"></div>
</main>

<!-- one window, filled per use -->
<div class="scrim" id="scrim"><div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="whead"><span id="winIcon"></span><h3 id="winTitle"></h3><button class="x" data-close aria-label="Close">×</button></div>
  <div id="winTabs"></div>
  <div class="wbody" id="winBody"></div>
  <div class="wfoot" id="winFoot" hidden></div>
</div></div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

async function call(method, path, body, raw) {
  const opt = { method, headers: {} };
  if (raw) { opt.body = raw; opt.headers["Content-Type"] = "application/octet-stream"; }
  else if (body !== undefined) { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch("api" + path, opt); // relative: works at / and behind a reverse proxy under a sub-path
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const ago = (t) => { if (!t) return "—"; const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + " s" : s < 3600 ? Math.round(s / 60) + " min" : s < 172800 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " d"; };
const fmtBytes = (b) => b == null ? "—" : b < 1024 ? Math.round(b) + " B" : b < 1048576 ? (b / 1024).toFixed(b < 10240 ? 1 : 0) + " KB" : b < 1073741824 ? (b / 1048576).toFixed(1) + " MB" : (b / 1073741824).toFixed(2) + " GB";
const fmtRate = (b) => b == null ? "—" : fmtBytes(b) + "/s";
const fmtMs = (ms) => ms == null ? "—" : ms < 10 ? ms.toFixed(1) + " ms" : ms < 1000 ? Math.round(ms) + " ms" : (ms / 1000).toFixed(1) + " s";
const fmtN = (n) => n == null ? "—" : n < 1000 ? String(Math.round(n)) : n < 1e6 ? (n / 1000).toFixed(n < 1e4 ? 1 : 0) + "k" : (n / 1e6).toFixed(1) + "M";

/** Copies text; the Clipboard API only works on https or localhost, so fall back to the old way. */
async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) { try { await navigator.clipboard.writeText(t); return true; } catch {} }
  const ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove(); return ok;
}
document.addEventListener("click", async (e) => {
  const c = e.target.closest("[data-copy]"); if (!c) return;
  e.preventDefault(); e.stopPropagation();
  const ok = await copyText(c.dataset.copy);
  toast(ok ? `Copied ${c.dataset.what || ""}`.trim() : "Couldn't copy: select it and press Ctrl+C", !ok);
  if (ok) { const old = c.textContent; c.textContent = "✓ Copied"; setTimeout(() => (c.textContent = old), 1500); }
}, true);
function toast(t, bad) { const el = $("#toast"); el.textContent = t; el.classList.toggle("bad", !!bad); el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), bad ? 6000 : 2800); }
const fail = (e) => toast(e.message || String(e), true);

/* ---------------- theme ---------------- */
const THEMES = [
  ["system", "System", ["#f3f4f7", "#0f1115"]], ["light", "Light", ["#f3f4f7", "#fff"]], ["dark", "Dark", ["#0f1115", "#171a21"]],
  ["midnight", "Midnight", ["#000", "#0b0b0e"]], ["slate", "Slate", ["#1b2230", "#232c3d"]], ["paper", "Paper", ["#f4efe6", "#fffcf6"]], ["contrast", "High contrast", ["#000", "#fff"]]
];
const ACCENTS = { indigo: "#6472e0", teal: "#1fae9e", violet: "#9363ea", orange: "#e57a2c", rose: "#e05282", green: "#45b058" };
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const t = store.get("pg-theme", "system");
  document.documentElement.dataset.theme = t === "system" ? (mq.matches ? "dark" : "light") : t;
  document.documentElement.dataset.accent = store.get("pg-accent", "indigo");
  $("#themes").innerHTML = THEMES.map(([id, name, [a, b]]) => `<button data-theme="${id}" class="${id === t ? "on" : ""}" aria-pressed="${id === t}"><span class="sample"><i style="background:${a}"></i><i style="background:${b}"></i></span>${name}</button>`).join("");
  const ac = store.get("pg-accent", "indigo");
  $("#accents").innerHTML = Object.entries(ACCENTS).map(([id, c]) => `<button data-accent="${id}" title="${id}" aria-label="${id}" aria-pressed="${id === ac}" class="${id === ac ? "on" : ""}" style="background:${c}"></button>`).join("");
  if (netState.open) renderNetwork();
}
mq.addEventListener?.("change", applyTheme);
$("#themeMenu").addEventListener("click", (e) => {
  const t = e.target.closest("#themes [data-theme]"), a = e.target.closest("#accents [data-accent]");
  if (t) { store.set("pg-theme", t.dataset.theme); applyTheme(); }
  else if (a) { store.set("pg-accent", a.dataset.accent); applyTheme(); }
  else if (e.target.closest("#themeBtn")) $("#themeMenu").classList.toggle("open");
});

/* ---------------- state ---------------- */
let st = null, items = [], filter = store.get("pg-filter", "all");
const remoteLists = {}, remoteLoaded = {};
let net = null;

async function refresh() {
  try {
    const [s, list] = await Promise.all([call("GET", "/status"), call("GET", "/integrations")]);
    st = s; items = list;
    render();
    renderChecklist();
    // first visit with nothing linked yet: offer the getting-started tour once
    if (!st.remotes.length && !store_.get("pegasus.tour.start") && !store_.get("pegasus.tour.offered") && !tour.name && !win.kind) {
      store_.set("pegasus.tour.offered", "1");
      startTour("start");
    }
  } catch (e) {
    $("#banner").innerHTML = `<div class="banner bad"><span>⚠</span><span><b>The hub isn't answering.</b> ${esc(e.message)}</span></div>`;
  }
}
let artNow = null;
async function refreshNet() {
  try {
    [net, artNow] = await Promise.all([call("GET", "/network"), call("GET", "/artwork").catch(() => null)]);
    renderTiles(); if (netState.open) renderNetwork();
  } catch {}
}
let resNow = null;
async function refreshRes() { try { resNow = await call("GET", "/resources"); renderTiles(); if (win.kind === "resources") renderResources(); } catch {} }
const batt = {}; // remote -> { compare, at }
async function refreshBattery(force) {
  for (const r of st?.remotes || []) {
    if (!force && batt[r.remote] && Date.now() - batt[r.remote].at < 60000) continue;
    try {
      const [compare, estimate] = await Promise.all([call("GET", `/remotes/${encodeURIComponent(r.remote)}/battery/compare`), call("GET", `/remotes/${encodeURIComponent(r.remote)}/battery/estimate`).catch(() => null)]);
      batt[r.remote] = { compare, estimate, at: Date.now() };
    } catch {}
  }
  renderTiles();
}
/** Times integrations finished moving to or from the hub, for chart markers. */
function moveMarks(remote) {
  const r = st?.remotes.find((x) => x.remote === remote) || st?.remotes[0];
  return Object.entries(r?.moves || {}).filter(([, m]) => m.status === "done" && m.updated).map(([id, m]) => ({ t: m.updated, color: m.dir === "toHub" ? "var(--ok)" : "var(--warn)", label: (m.dir === "toHub" ? "→ hub: " : "← remote: ") + id }));
}

/* ---------------- render: top, banner, tiles ---------------- */
function render() {
  $("#ver").textContent = `${st.version} · ${st.arch}`;
  $("#pills").innerHTML = st.remotes.length
    ? st.remotes.map((r) => `<span class="rpill ${r.standby ? "sleep" : ""}" title="${esc(r.remote)} · Bridge ${esc(r.bridge)}"><span class="dot"></span><b>${esc(shortName(r.remote))}</b><span class="lat">${r.standby ? "asleep" : fmtMs(r.rttMs)}</span></span>`).join("")
    : `<span class="rpill off"><span class="dot"></span>No remote linked</span>`;
  const crashed = items.filter((m) => m.status.state === "crashed");
  const noAccess = st.remotes.filter((r) => r.access === false);
  $("#banner").innerHTML =
    (!st.remotes.length ? `<div class="banner warn" style="flex-wrap:wrap"><span>📱</span><span style="flex:1;min-width:220px"><b>No remote is linked.</b> In Pegasus Bridge's setup on the remote, paste the hub address and the pairing code.</span>
      <button class="btn" data-copy="${esc((st.pairing.address || location.hostname) + ":" + st.pairing.port)}" data-what="the hub address">Copy address</button><button class="btn" data-copy="${esc(st.pairing.token)}" data-what="the pairing code">Copy code</button><button class="btn primary" data-a="pair" style="margin-left:0">How to pair</button></div>` : "") +
    noAccess.map((r) => `<div class="banner bad"><span>🔑</span><span><b>${esc(r.remote)}: the Bridge has no access to the remote.</b> Run the Bridge's setup again on the remote and enter the web-configurator PIN.</span></div>`).join("") +
    crashed.map((m) => `<div class="banner warn"><span>⚠</span><span><b>${esc(m.name)} keeps crashing</b> (${m.status.restarts} restarts). Its devices are unavailable on the remotes.</span><button class="btn" data-a="logs" data-id="${esc(m.id)}">See the log</button></div>`).join("");
  renderTiles();
  renderList();
  renderRemotes();
}
const shortName = (n) => n.replace(/\.local$/, "");

function spark(values, color) {
  const v = values.filter((x) => x != null);
  if (v.length < 2) return "";
  const max = Math.max(...v, 1e-9), W = 100, H = 22;
  const pts = values.map((x, i) => x == null ? null : `${((i / (values.length - 1)) * W).toFixed(1)},${(H - 2 - (x / max) * (H - 4)).toFixed(1)}`).filter(Boolean);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function renderTiles() {
  if (!st) return;
  const r0 = st.remotes[0];
  const list = r0 && remoteLists[r0.remote] && !remoteLists[r0.remote].error ? remoteLists[r0.remote] : null;
  const onHub = items.length, running = items.filter((m) => m.status.state === "running").length;
  const slots = list ? list.filter((i) => i.type === "CUSTOM").length : null;
  // 1. integrations: where they run
  const t1 = `<button class="tile" data-a="integrations"><div class="k">Integrations</div>
    <div class="v">${onHub} <small>on the hub${running < onHub ? ` · ${onHub - running} not running` : ""}</small></div>
    <div class="sub2">${slots == null ? (r0 ? "reading the remote…" : "no remote linked") : `${slots} of 10 install slots used on ${esc(shortName(r0.remote))}`}</div>
    ${slots == null ? "" : `<div class="bar"><i style="width:${slots * 10}%"></i></div>`}</button>`;
  // 2. CPU and memory
  const cpu = items.reduce((a, m) => a + (m.usage?.cpu || 0), 0), mem = items.reduce((a, m) => a + (m.usage?.memMB || 0), 0) + (st.hubMemMB || 0);
  const rr = resNow?.remotes.find((x) => x.last);
  const t2 = `<button class="tile" data-a="resources"><div class="k">CPU &amp; memory</div>
    <div class="v">${cpu.toFixed(1)}<small>% CPU</small> · ${mem}<small> MB</small></div>
    <div class="sub2">${rr ? `remote: load ${rr.last.load1?.toFixed(2) ?? "—"} · ${rr.last.memUsedMB} of ${rr.last.memTotalMB} MB` : "on the hub"}</div>
    ${spark((resNow?.hub.history || []).slice(-60).map((h) => h.cpu), "var(--accent)")}</button>`;
  // 3. network
  const live = st.remotes.filter((r) => !r.standby && r.rttMs != null);
  const rtt = live.length ? live.reduce((a, r) => a + r.rttMs, 0) / live.length : null;
  const nr = net?.remotes.find((r) => r.connected);
  const traffic = net ? net.remotes.reduce((a, r) => a + r.rate.inBps + r.rate.outBps, 0) : null;
  const t3 = `<button class="tile" data-a="network"><div class="k">Network</div>
    <div class="v">${rtt != null ? fmtMs(rtt).replace(" ms", " <small>ms round trip</small>") : st.remotes.some((r) => r.standby) ? "<small>remote asleep</small>" : "<small>no link</small>"}</div>
    <div class="sub2">${traffic == null ? "" : fmtRate(traffic) + " · " + fmtN(nr ? nr.rate.msgsPerMin : 0) + " messages/min"}</div>
    ${spark((nr?.history || []).slice(-60).map((h) => h.rtt), "var(--accent)")}</button>`;
  // 4. battery
  const b = r0 && batt[r0.remote]?.compare;
  const est = r0 && batt[r0.remote]?.estimate;
  const last = b?.after?.last || b?.before?.last;
  const sv = b?.saving;

/* ---------------- each linked remote: what's on it, with Move ---------------- */
const TYPE = { CUSTOM: "installed on the remote", EXTERNAL: "external", LOCAL: "built into the remote" };
async function loadRemote(name, force, every = 60000) {
  // the hub keeps one copy for every open page and asks the remote at most once a minute;
  // a page in a background tab doesn't ask at all
  if (document.hidden && !force) return;
  if (!force && remoteLoaded[name] && Date.now() - remoteLoaded[name] < every) return;
  remoteLoaded[name] = Date.now();
  try { remoteLists[name] = await call("GET", `/remotes/${encodeURIComponent(name)}/integrations${force ? "?fresh=1" : ""}`); }
  catch (e) { remoteLists[name] = { error: e.message }; }
  renderRemotes();
}
/** A move's error in plain words; the raw message goes under "Details". */
function friendlyMoveError(err, driverId) {
  const e = String(err || "");
  let m;

    const [drv, , ...rest] = m[1].split(".");
    if (driverId && drv !== driverId) return `The remote won't save an activity that has a step for <b>${esc(m[1])}</b>: that entity belongs to another integration (<b>${esc(drv)}</b>) and no longer exists on the remote. Update the Bridge to 0.4.7 or newer and Retry: it leaves out steps for integrations that are gone. Or remove that step from the activity and Retry.`;
    return `The remote refused to put <b>${esc(rest.join(".") || m[1])}</b> back into an activity, because that entity isn't selected on the remote yet.`;
  }
  if ((m = /could not select \d+ of \d+ entities \(([^)]*)\): they belong to other integrations/.exec(e))) return `The activity also uses <b>${esc(m[1])}</b> from another integration, and the remote doesn't have ${m[1].includes(",") ? "those entities" : "that entity"} right now. If that device is off or its integration disconnected, fix that and Retry; if it's gone for good, continue without it.`;
  if ((m = /could not select (\d+) of (\d+) entities \(([^)]*)\):\s*(.*)$/s.exec(e))) return `Couldn't select ${m[1]} of its ${m[2]} entities on the remote (<b>${esc(m[3])}</b>): ${/does not offer/.test(m[4]) ? "the integration on the hub doesn't offer them. If they belong to a device that is off, turn it on and Retry; if they were removed from the integration, continue without them." : esc(m[4])}`;
  if (/Integration is not active/i.test(e)) return "The integration wasn't running at that moment, so the remote couldn't list its entities.";
  if (/no answer within|timed? ?out/i.test(e)) return "The remote or the hub didn't answer in time.";
  if (/not linked|link lost|link closed/i.test(e)) return "The remote's link to the hub dropped during the move.";
  if (/maximum custom|no free (install )?slot/i.test(e)) return "There's no free install slot on the remote. Move another integration to the hub first.";
  if (/checksum/i.test(e)) return "The package from the hub arrived damaged.";
  if ((m = /runs a test build \(([^)]+)\)\. Install the ([^ ]+) release/.exec(e))) return `The remote runs a test build (${esc(m[1])}) that has no release on GitHub, so the hub can't install the same version. Install the ${esc(m[2])} release on the remote first, then move it.`;
  if (/no release tag for version/i.test(e)) return "Its GitHub repository has no release for the version on your remote, so the hub can't install the same version.";
  if (/no GitHub release/i.test(e)) return "Its GitHub repository has no release package for this version, so it can't be moved back automatically. The integration's author (or you) needs to publish that release first.";
  if (/has no .*tar\.gz/i.test(e)) return "Its GitHub release has no package for the remote, so it can't be moved back automatically.";
  if ((m = /HTTP (\d{3})/.exec(e))) return `The remote refused one of the changes (HTTP ${m[1]}).`;
  return esc(e.length > 180 ? e.slice(0, 177) + "…" : e);
}
const STEP = { "hub copy": "installing it on the hub", snapshot: "saving where it's used", "stand-in": "swapping in the stand-in", settings: "handing over its settings", "free slot": "freeing its slot", register: "registering it from the hub", instance: "selecting its entities again", restore: "putting its references back", verify: "checking every reference", "hub package": "packing it on the hub", download: "downloading it from the hub", "remove external": "removing the hub registration", "remove stand-in": "removing the stand-in", install: "installing it on the remote", "hub cleanup": "removing the hub copy" };
/** An integration's own management page, at the address this hub page was opened with. */
function pageUrl(pg) {

function moveBox(mv, i, remote) {

        <div class="field"><label for="gitUrl">Repository</label><input class="inp" id="gitUrl" placeholder="https://github.com/owner/uc-intg-something" autocomplete="off"><div class="help">A GitHub link to the integration's source code.</div></div>
        <div class="field"><label for="gitRef">Version</label><input class="inp" id="gitRef" placeholder="newest release"><div class="help">Empty follows new releases. A tag or branch pins one.</div></div>
      </div>
      <p class="sub2">The hub reads how its author runs it (Dockerfile, package entry point or driver.py), installs its dependencies and starts it. It then appears on every linked remote under Integrations.</p>`
    : `<label class="drop" id="drop"><input type="file" id="archive" accept=".gz,.tgz" hidden><div style="font-size:28px">⬆</div><b>Drop a .tar.gz here</b> or choose a file<div class="sub2" id="dropName">The same archive you would upload to the remote.</div></label>
       <div class="banner warn" style="margin:14px 0 0"><span>⚠</span><span>Archives with a program built only for the remote's processor (aarch64) can't run on this server${st ? ` (${esc(st.arch)})` : ""}. Install from the GitHub source instead.</span></div>`,
    foot: `<span class="left">It appears on every linked remote by itself.</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="doInstall">Install</button>` });
  $("#winTabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b && b.dataset.tab !== tab) showAdd(b.dataset.tab); };
  if (tab === "git") setTimeout(() => $("#gitUrl").focus(), 0);
  else {
    const drop = $("#drop"), inp = $("#archive");
    inp.onchange = () => ($("#dropName").textContent = inp.files[0]?.name || "");
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) { inp.files = e.dataTransfer.files; inp.onchange(); } };
  }
  $("#doInstall").onclick = async () => {
    try {
      if (tab === "git") {
        const url = $("#gitUrl").value.trim(); if (!url) return $("#gitUrl").focus();
        const j = await call("POST", "/integrations", { url, ref: $("#gitRef").value.trim() });
        followJob(j.job, "Installing " + url.replace(/^https:\/\/github.com\//, ""));
      } else {
        const f = $("#archive").files[0]; if (!f) return toast("Choose an archive first", true);
        const j = await call("POST", "/integrations/upload?name=" + encodeURIComponent(f.name), undefined, f);
        followJob(j.job, "Installing " + f.name);
      }
    } catch (err) { fail(err); }
  };
}

function followJob(jobId, title) {
  openWin({ kind: "job", title, body: '<pre class="log" id="jobPre" style="height:min(50vh,380px)"></pre>', foot: `<span class="left" id="jobState">Working… you can close this, it keeps going.</span><button class="btn" data-close>Close</button>` });
  const tick = async () => {
    const j = await call("GET", "/jobs/" + jobId).catch(() => null); if (!j || win.kind !== "job") return;
    const pre = $("#jobPre");
    pre.innerHTML = j.lines.map((l) => `<span class="${/^(FAILED|ERROR)|error:/i.test(l) ? "e" : /^\$ |^entry point|^runtime/.test(l) ? "h" : /^done/.test(l) ? "ok" : ""}">${esc(l)}</span>`).join("\n");
    pre.scrollTop = 1e9;
    if (j.state !== "running") {
      clearInterval(win.timer);
      $("#jobState").innerHTML = j.state === "done" ? `<b class="ck">Done.</b> Open it on the remote under Integrations to set it up.` : `<b class="bd">Failed:</b> ${esc(j.error)}`;
      refresh();
    }
  };
  tick(); win.timer = setInterval(tick, 700);
}

/* logs */
function showLogs(m, source) {
  const isBridge = !!source;
  const title = isBridge ? `Pegasus Bridge on ${shortName(source)}` : `${m.name} — log`;
  openWin({ kind: "logs", title, icon: isBridge ? "" : iconOf(m), size: "wide",
    body: `<div class="logbar"><input class="inp" id="logQ" placeholder="Filter" aria-label="Filter the log"><label class="chk"><input type="checkbox" id="logErr"> Problems only</label><label class="chk"><input type="checkbox" id="logFollow" checked> Follow</label><button class="btn small" id="logDl" style="margin-left:auto">Download</button></div><pre class="log" id="logPre"></pre>` });
  let lines = [];
  const draw = () => {
    const q = $("#logQ").value.toLowerCase(), errOnly = $("#logErr").checked, pre = $("#logPre");
    const shown = lines.filter((l) => (!q || l.toLowerCase().includes(q)) && (!errOnly || /error|exception|traceback|failed|warn|crash|exited|stopped at/i.test(l)));
    pre.innerHTML = shown.length ? shown.map((l) => `<span class="${/error|exception|traceback|failed|STOPPED/i.test(l) ? "e" : /\[hub\]|^.{0,25}move /.test(l) ? "h" : ""}">${esc(l)}</span>`).join("\n") : `<span class="h">${lines.length ? "Nothing matches." : isBridge ? "Nothing yet (Bridge 0.2.1 or newer sends its log here)." : "Nothing logged yet."}</span>`;
    if ($("#logFollow").checked) pre.scrollTop = 1e9;
  };
  const load = async () => {
    if (win.kind !== "logs") return;
    const j = await call("GET", isBridge ? `/remotes/${encodeURIComponent(source)}/log` : `/integrations/${m.id}/logs`).catch((e) => ({ lines: [e.message] }));
    lines = j.lines || []; draw();
  };
  $("#logQ").oninput = draw; $("#logErr").onchange = draw;
  $("#logDl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/plain" })); a.download = `${isBridge ? "pegasus-bridge" : m.id}-log.txt`; a.click(); };
  load(); win.timer = setInterval(load, 1500);
}

  $("#winTabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; $$("#winTabs [data-tab]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); }); $$("#winBody [data-pane]").forEach((p) => (p.hidden = p.dataset.pane !== b.dataset.tab)); };

      : `<div class="pair">

          <li>Start its setup. Paste the <b>hub address</b> and the <b>pairing code</b> with the Copy buttons above, and enter the web-configurator PIN.</li>

/* battery */
async function showBattery(remote, days) {
  openWin({ kind: "battery", title: `Battery — ${shortName(remote)}`, size: "wide", body: '<p class="sub2">Loading…</p>' });
  let j, cmpj, est;
  try { [j, cmpj, est] = await Promise.all([call("GET", `/remotes/${encodeURIComponent(remote)}/battery?days=${days}`), call("GET", `/remotes/${encodeURIComponent(remote)}/battery/compare`), call("GET", `/remotes/${encodeURIComponent(remote)}/battery/estimate`).catch(() => null)]); }
  catch (e) { $("#winBody").innerHTML = `<p class="bd">${esc(e.message)}</p>`; return; }
  if (win.kind !== "battery") return;
  const S = j.samples.filter((x) => typeof x.level === "number");
  const sum = j.summary, prev = j.previous;
  const W = 860, Hh = 220, pad = 32, t1 = Date.now(), t0 = t1 - days * 864e5;
  const X = (t) => pad + ((t - t0) / (t1 - t0)) * (W - pad - 8), Y = (l) => 8 + (1 - l / 100) * (Hh - 8 - 22);
  let shades = "";
  for (let i = 1; i < S.length; i++) {
    const a = S[i - 1], c = S[i];
    if (a.event === "standby") shades += `<rect x="${X(a.t)}" y="8" width="${Math.max(1, X(c.t) - X(a.t))}" height="${Hh - 30}" fill="var(--accent)" opacity=".10"/>`;
    if (a.charging) shades += `<rect x="${X(a.t)}" y="${Hh - 22}" width="${Math.max(1, X(c.t) - X(a.t))}" height="4" fill="var(--ok)"/>`;
  }
  const line = S.map((x, i) => `${i ? "L" : "M"}${X(x.t).toFixed(1)},${Y(x.level).toFixed(1)}`).join("");
  shades += moveMarks(remote).filter((m) => m.t >= t0).map((m) => `<line x1="${X(m.t)}" x2="${X(m.t)}" y1="8" y2="${Hh - 22}" stroke="${m.color}" stroke-width="2" stroke-dasharray="5 3"><title>${esc(m.label)}</title></line>`).join("");
  const grid = [0, 25, 50, 75, 100].map((l) => `<line x1="${pad}" x2="${W - 8}" y1="${Y(l)}" y2="${Y(l)}" stroke="var(--line)"/><text x="2" y="${Y(l) + 4}" font-size="10" fill="var(--mute)">${l}%</text>`).join("");
  const ticks = Array.from({ length: days + 1 }, (_, i) => `<text x="${X(t0 + i * 864e5)}" y="${Hh - 4}" font-size="10" fill="var(--mute)" text-anchor="middle">${new Date(t0 + i * 864e5).toLocaleDateString(undefined, days === 1 ? { hour: "numeric" } : { weekday: "short" })}</text>`).join("");
  const f = (v, u) => (v == null ? "—" : v + u);
  const cmp = (a, b) => (a == null || b == null ? "" : ` <span class="sub2" style="display:inline">(was ${b})</span>`);
  const last = sum.last, who = sum.keptAwakeBy.length ? sum.keptAwakeBy.map((w) => esc(w.who)).join(", ") : "nothing";
  const c = cmpj, sv = c.saving, dr = (s, k) => s?.drainPerHour?.[k] == null ? "—" : s.drainPerHour[k] + " %/h";
  const CONF = { good: "several days on each side", fair: "a day or more on each side", low: "only a few hours of readings so far: an early estimate" };
  const savingHtml = estimateHtml(est) + (!c.split
    ? `<p class="sub2">Measured: no integration has moved to the hub yet, so there's no before and after to compare. The battery is recorded either way.</p>`
    : `<div class="netsec" style="margin:0 0 6px;padding:0;border:0"><div class="nethead" style="margin-bottom:6px"><h4>Measured: before and after the first move</h4><span class="sub2" style="margin:0">first move ${new Date(c.split).toLocaleString()}</span></div>
      <div class="netgrid">
        <div class="stat"><div class="k">Saved per day</div><div class="v">${sv ? (sv.percentPerDay > 0 ? `${sv.percentPerDay}<small>% battery</small>` : `0<small>%</small>`) : "—"}</div><div class="sub2">${sv?.relative != null && sv.percentPerDay > 0 ? `${Math.round(sv.relative * 100)}% less drain` : sv ? "no difference measured" : "needs readings on both sides"}</div></div>
        <div class="stat"><div class="k">A full charge lasts</div><div class="v">${sv?.daysPerChargeAfter ? sv.daysPerChargeAfter + "<small> days</small>" : "—"}</div><div class="sub2">${sv?.daysPerChargeBefore ? `was ${sv.daysPerChargeBefore} days` : ""}</div></div>
        <div class="stat"><div class="k">Drain while awake</div><div class="v">${dr(c.after, "awake")}</div><div class="sub2">was ${dr(c.before, "awake")}</div></div>
        <div class="stat"><div class="k">Drain while asleep</div><div class="v">${dr(c.after, "asleep")}</div><div class="sub2">was ${dr(c.before, "asleep")}</div></div>
      </div>
      <p class="sub2" style="margin-top:0">${sv ? `Based on ${sv.hoursBefore} h of readings before and ${sv.hoursAfter} h after (${CONF[sv.confidence]}), with the remote awake about ${sv.awakeHoursPerDay} h a day. How much you use the remote changes the drain too, so compare similar days.` : "Needs at least half an hour of awake readings before and after the first move."}</p></div>`);
  $("#winBody").innerHTML = savingHtml + `
    <div class="seg" style="margin:0 0 12px">${[1, 7, 30].map((d) => `<button data-days="${d}" class="${d === days ? "on" : ""}">${d === 1 ? "24 h" : d + " days"}</button>`).join("")}</div>
    ${S.length < 2 ? '<p class="sub2">Not enough readings yet. The Bridge records the battery every 10 minutes while the remote is awake, and around sleep; give it a day.</p>' : ""}
    <svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Battery level over time">${grid}${shades}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent);opacity:.25"></i>asleep</span><span><i style="background:var(--ok)"></i>charging</span><span><i style="background:var(--ok)"></i>dashed: moved to the hub</span><span><i style="background:var(--warn)"></i>dashed: moved back</span></div>
    <div class="nethead" style="margin:4px 0 0"><h4>${days === 1 ? "Last 24 hours" : `Last ${days} days`}</h4></div>
    <div class="netgrid">
      <div class="stat"><div class="k">Level now</div><div class="v">${last ? `${last.level}<small>%${last.charging ? " · charging" : ""}</small>` : "—"}</div></div>
      <div class="stat"><div class="k">Drain while awake</div><div class="v">${f(sum.drainPerHour.awake, "<small> %/h</small>")}</div><div class="sub2">over ${sum.hours.awake} h${cmp(sum.drainPerHour.awake, prev.drainPerHour.awake)}</div></div>
      <div class="stat"><div class="k">Drain while asleep</div><div class="v">${f(sum.drainPerHour.asleep, "<small> %/h</small>")}</div><div class="sub2">over ${sum.hours.asleep} h${cmp(sum.drainPerHour.asleep, prev.drainPerHour.asleep)}</div></div>
      <div class="stat"><div class="k">A full charge lasts</div><div class="v">${sum.hoursPerCharge ? `${Math.round(sum.hoursPerCharge / 24 * 10) / 10}<small> days</small>` : "—"}</div><div class="sub2">at this use${cmp(sum.hoursPerCharge, prev.hoursPerCharge)}</div></div>
    </div>
    <p class="sub2">Kept awake: ${sum.keptAwakeShare == null ? "—" : Math.round(sum.keptAwakeShare * 100) + "% of awake readings"}, by ${who}. "was" is the ${days === 1 ? "24 hours" : days + " days"} before; overnight drain is the fairest before/after comparison.</p>`;
  $$("#winBody [data-days]").forEach((b) => (b.onclick = () => showBattery(remote, Number(b.dataset.days))));
  const form = $("#bmodel");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const body = {};
      for (const i of $$("#bmodel input[data-k]")) body[i.dataset.k] = i.type === "checkbox" ? i.checked : Number(i.value);
      try { await call("PATCH", "/battery/model", body); toast("Assumptions saved"); await refreshBattery(true); showBattery(remote, days); } catch (err) { fail(err); }
    };
    $("#bmodelReset").onclick = async () => { try { await call("PATCH", "/battery/model", { reset: true }); toast("Back to the defaults"); await refreshBattery(true); showBattery(remote, days); } catch (err) { fail(err); } };
  }
}

const fmtPct = (v) => (v == null ? "—" : v < 0 ? "−" + fmtPct(-v) : v >= 10 ? Math.round(v) + "%" : v >= 1 ? v.toFixed(1) + "%" : v > 0 ? v.toFixed(2) + "%" : "0%");
const fmtHours = (h) => (h == null ? "—" : h >= 48 ? (h / 24).toFixed(1) + " days" : h >= 1 ? Math.round(h) + " h" : Math.round(h * 60) + " min");
/** The estimate: what the integrations on the hub would cost the remote's battery if they ran on it. */
function estimateHtml(est) {
  if (!est) return "";
  if (!est.integrations.length) return `<p class="sub2">No integrations run on the hub for this remote yet, so there's nothing to estimate.</p>`;
  const t = est.total, m = est.model;
  const bar = (v, max) => `<span class="mini" style="width:70px"><i style="width:${Math.max(0, Math.min(100, (v / (max || 1)) * 100))}%"></i></span>`;
  const max = Math.max(...est.integrations.map((x) => x.perDay.savedPct || 0), 0.0001);
  const rows = est.integrations.map((x) => `<tr>
      <td><b>${esc(x.name)}</b><div class="sub2">${x.inputs.cpu ?? 0}% CPU here · ${x.inputs.deviceKBPerMin == null ? "device traffic not measured" : `${x.inputs.deviceKBPerMin} KB/min to devices`} · ${x.inputs.linkKBPerMin} KB/min over the link${x.inputs.remoteApiKBPerMin ? ` · <b>${x.inputs.remoteApiKBPerMin} KB/min with the remote's own API</b> (stays inside the remote when it runs there, so on the hub it costs battery)` : ""}</div></td>
      <td class="num">${fmtPct(x.perDay.cpuPct)}</td><td class="num">${fmtPct(x.perDay.networkPct)}</td><td class="num">${x.perDay.linkPct > 0 ? "−" + fmtPct(x.perDay.linkPct) : "0%"}</td>
      <td class="num">${x.perDay.savedPct < 0 ? `<b class="bd">−${fmtPct(-x.perDay.savedPct)}</b>` : `<b>${fmtPct(x.perDay.savedPct)}</b>`} ${bar(x.perDay.savedPct, max)}</td><td class="num">${x.memMB == null ? "—" : x.memMB + " MB"}</td></tr>`).join("");
  const mem = est.memory;
  const field = (k, label, step, help) => `<label class="field" style="margin:0"><span class="sub2" style="margin:0">${label}</span><input class="inp" type="number" step="${step}" min="0" data-k="${k}" value="${m[k]}" title="${esc(help)}"></label>`;
  return `<div class="netsec" style="margin:0 0 10px;padding:0;border:0"><div class="nethead" style="margin-bottom:6px"><h4>Estimated saving</h4><span class="sub2" style="margin:0">what these integrations would cost the battery if they ran on the remote</span></div>
    <div class="netgrid">
      <div class="stat"><div class="k">${t.savedPctPerDay < 0 ? "Costs per day" : "Saved per day"}</div><div class="v">${fmtPct(Math.abs(t.savedPctPerDay)).replace("%", "<small>% battery</small>")}</div><div class="sub2">≈ ${Math.round((t.savedWhPerDay || 0) * 1000)} mWh a day</div></div>
      <div class="stat"><div class="k">Longer per charge</div><div class="v">${t.extraHoursPerCharge != null ? fmtHours(t.extraHoursPerCharge) : "—"}</div><div class="sub2">${t.daysPerChargeNow ? `${t.daysPerChargeNow} days now, ${t.daysPerChargeOnRemote} if on the remote` : "needs a day of battery readings"}</div></div>
      <div class="stat"><div class="k">Memory freed on the remote</div><div class="v">${mem.freedMB}<small> MB</small></div><div class="sub2">${mem.remoteTotalMB ? `of ${mem.remoteTotalMB} MB; ${mem.remoteUsedMB} MB in use there now` : "RAM has no battery cost; it's room on the remote"}</div></div>
      <div class="stat"><div class="k">Pegasus Bridge on the remote</div><div class="v">${est.bridge.cpu != null ? est.bridge.cpu + "<small>% CPU</small>" : "—"}</div><div class="sub2">${est.bridge.cpu != null ? `costs ≈ ${fmtPct(est.bridge.pct)} a day (taken off)` : "measured after a few minutes"}</div></div>
    </div>
    <div class="tablewrap" style="border:0;margin-top:6px;overflow-x:auto"><table class="rtable est"><thead><tr><th>Integration</th><th class="num">CPU</th><th class="num">Network</th><th class="num">Remote's Wi-Fi now</th><th class="num">Saved / day</th><th class="num">Memory</th></tr></thead><tbody>${rows}</tbody></table></div>
    <details style="margin-top:8px"><summary class="sub2" style="cursor:pointer">How this is estimated, and the assumptions</summary>
      <p class="sub2">For each integration: its processor time on this hub, times how much slower the remote's processor is, times the power of a busy remote core; plus the Wi-Fi energy for the traffic to its devices (bytes and sends); minus the Wi-Fi energy the remote now spends for it: the link to the hub, and any traffic with the remote's own API (Remote Self-Control and similar talk to the remote itself; on the remote that stays inside it, on the hub it crosses its Wi-Fi). Counted for the ${Math.round(est.awakeShare * 24)} h a day the remote is awake${est.awakeShareMeasured ? " (from its battery readings)" : " (assumed: the readings don't show it asleep yet)"}. Device traffic is counted from each integration's TCP connections; short connections and UDP (discovery) can be missed, so that part is a lower bound.${est.networkMeasured ? "" : " (This hub can't list connections, so device traffic isn't counted.)"} The measured before/after figures below are the check on these numbers.</p>
      <form id="bmodel" class="netgrid" style="align-items:end">
        ${field("batteryWh", "Battery (Wh)", "0.1", "Remote 3: 2400 mAh × 3.7 V ≈ 8.9 Wh")}
        ${field("cpuSlowdown", "Remote CPU slower by (×)", "0.5", "How many times longer the remote takes for the same work than one core here")}
        ${field("cpuWattsPerCore", "Busy remote core (W)", "0.05", "Extra power of one fully busy core on the remote")}
        ${field("wifiJoulesPerMB", "Wi-Fi per MB (J)", "0.05", "Energy to move one megabyte over Wi-Fi")}
        ${field("wifiJoulesPerSend", "Wi-Fi per packet (J)", "0.005", "Radio wake-up and tail per packet, averaged")}
        ${field("wifiActiveWatts", "Wi-Fi fully busy (W)", "0.05", "Most the radio can draw; heavy traffic can't cost more than this")}
        ${field("awakeShareDefault", "Awake share if unmeasured", "0.05", "Share of the day the remote is awake, used until there are battery readings")}
        <div style="display:flex;gap:6px"><button class="btn primary small" type="submit">Save</button><button class="btn small" type="button" id="bmodelReset">Defaults</button></div>
      </form></details></div>`;
}

/* ---------------- network statistics ---------------- */
const netState = { open: false, hours: Number(store.get("pg-net-hours", 1)), focus: null };
function showNetwork(focus) {
  netState.open = true; netState.focus = focus;
  openWin({ kind: "network", title: "Network statistics", size: "wide", body: '<p class="sub2">Loading…</p>' });
  refreshNet(); win.timer = setInterval(refreshNet, 5000);
}
function lineChart({ series, t0, t1, H = 150, yFmt, down = [], marks = [] }) {
  const W = Math.round(Math.max(340, Math.min(900, ($("#winBody")?.clientWidth || 900) - 36))), L = 46, R = 10, T = 10, B = 22;
  const all = series.flatMap((s) => s.points.map((p) => p[1])).filter((v) => v != null);
  let max = all.length ? Math.max(...all) : 1; if (max <= 0) max = 1;
  const nice = (v) => { const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  max = nice(max * 1.1);
  const X = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R), Y = (v) => T + (1 - v / max) * (H - T - B);
  const grid = [0, .5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(max * f) + 4}" font-size="10.5" fill="var(--mute)" text-anchor="end">${yFmt(max * f)}</text>`).join("");
  const span = t1 - t0, fit = Math.max(2, Math.floor((W - L - R) / 75));
  const step = [300e3, 600e3, 900e3, 1800e3, 3600e3, 7200e3, 4 * 3600e3, 6 * 3600e3].find((x) => span / x <= fit) || 12 * 3600e3;
  let ticks = ""; for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) ticks += `<text x="${X(t)}" y="${H - 6}" font-size="10.5" fill="var(--mute)" text-anchor="middle">${new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</text>`;
  const drops = down.map((t) => `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}" stroke="var(--bad)" stroke-dasharray="3 3"/>`).join("")
    + marks.filter((m) => m.t >= t0 && m.t <= t1).map((m) => `<line x1="${X(m.t)}" x2="${X(m.t)}" y1="${T}" y2="${H - B}" stroke="${m.color}" stroke-width="2" stroke-dasharray="5 3"><title>${esc(m.label)} · ${new Date(m.t).toLocaleTimeString()}</title></line>`).join("");
  const paths = series.map((s) => {
    if (s.bars) { const bw = Math.max(1, (W - L - R) / ((t1 - t0) / 60000) - 1); return s.points.filter((p) => p[1] != null).map(([t, v]) => `<rect x="${X(t) + (s.offset || 0) * bw / 2}" y="${Y(v)}" width="${bw / 2}" height="${Math.max(0, H - B - Y(v))}" fill="${s.color}" opacity=".85"><title>${new Date(t).toLocaleTimeString()} · ${yFmt(v)}</title></rect>`).join(""); }
    let d = "", on = false;
    for (const [t, v] of s.points) { if (v == null) { on = false; continue; } d += `${on ? "L" : "M"}${X(t).toFixed(1)},${Y(v).toFixed(1)}`; on = true; }
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${ticks}${drops}${paths}</svg>`;
}
function renderNetwork() {
  if (!net || win.kind !== "network") return;
  const now = net.now, hours = netState.hours, t0 = now - hours * 3600e3;
  const remotes = net.remotes.length ? net.remotes.map((r) => {
    const h = r.history.filter((x) => x.t >= t0);
    const status = !r.connected ? `<span class="status st-stopped">not linked</span>${r.lastDown ? `<span class="sub2">since ${ago(r.lastDown)} ago</span>` : ""}` : r.standby ? `<span class="status st-idle">asleep</span>` : `<span class="status st-running">linked</span>`;
    return `<div class="netsec">
      <div class="nethead"><h4>${esc(shortName(r.remote))}</h4>${status}<span class="sub2" style="margin:0">${r.connected ? `up ${ago(r.since)}` : ""}${r.reconnects ? ` · ${r.reconnects} reconnect${r.reconnects > 1 ? "s" : ""}` : ""}${r.bridge ? ` · Bridge ${esc(r.bridge)}` : ""}${r.address ? ` · ${esc(r.address)}` : ""}</span></div>
      <div class="netgrid">
        <div class="stat"><div class="k">Round trip now</div><div class="v">${fmtMs(r.rtt.now)}</div><div class="sub2">median ${fmtMs(r.rtt.median)} · 95% ${fmtMs(r.rtt.p95)}</div></div>
        <div class="stat"><div class="k">Best · worst</div><div class="v">${fmtMs(r.rtt.min)} <small>·</small> ${fmtMs(r.rtt.max)}</div><div class="sub2">of the last 200 link checks</div></div>
        <div class="stat"><div class="k">Traffic now (5 min)</div><div class="v"><span style="color:var(--in)">↓</span>${fmtRate(r.rate.inBps)} <span style="color:var(--out)">↑</span>${fmtRate(r.rate.outBps)}</div><div class="sub2">${fmtN(r.rate.msgsPerMin)} messages / min</div></div>
        <div class="stat"><div class="k">Since the hub started</div><div class="v"><small>from remote</small> ${fmtBytes(r.totals.bytesIn)}</div><div class="sub2">to remote ${fmtBytes(r.totals.bytesOut)} · ${fmtN(r.totals.msgsIn + r.totals.msgsOut)} msgs</div></div>
      </div>
      ${h.length ? `
      ${lineChart({ t0, t1: now, yFmt: (v) => fmtMs(v), down: h.filter((x) => x.down).map((x) => x.t), series: [
        { color: "var(--accent)", points: h.map((x) => [x.t + 30e3, x.rtt]) },
        { color: "var(--faint)", dash: "4 3", width: 1.5, points: h.map((x) => [x.t + 30e3, x.rttMax]) }] })}
      <div class="legend"><span><i style="background:var(--accent)"></i>round trip, average per minute</span><span><i style="background:var(--faint)"></i>slowest in that minute</span><span><i style="background:var(--bad)"></i>link dropped</span></div>
      ${lineChart({ t0, t1: now, H: 130, yFmt: (v) => fmtBytes(v), series: [
        { bars: true, color: "var(--in)", offset: 0, points: h.map((x) => [x.t, x.bytesIn]) },
        { bars: true, color: "var(--out)", offset: 1, points: h.map((x) => [x.t, x.bytesOut]) }] })}
      <div class="legend"><span><i style="background:var(--in)"></i>from the remote, per minute</span><span><i style="background:var(--out)"></i>to the remote, per minute</span></div>` : `<p class="sub2">No traffic in this period${r.standby ? " (the remote is asleep; nothing is sent to it until it wakes)" : ""}.</p>`}
    </div>`;
  }).join("") : `<p class="sub2">No remote has linked since the hub started.</p>`;

  const ints = [...net.integrations].sort((a, b) => (b.totals.msgsIn + b.totals.msgsOut) - (a.totals.msgsIn + a.totals.msgsOut));
  const focusRow = (x) => netState.focus && x.id === netState.focus ? ' style="background:var(--accent-soft)"' : "";
  const table = ints.length ? `<div class="tablewrap"><table>
    <thead><tr><th>Integration</th><th class="num" title="Requests from the remote (commands, browsing, entity states)">Requests</th><th class="num" title="Time the integration takes to answer, measured on the hub">Answers in</th><th class="num">95%</th><th>Slowest</th><th class="num">Events</th><th class="num" title="Updates the hub didn't send to the remote: for devices it doesn't use, exact repeats, and ones merged while it slept">Not sent</th><th class="num">Traffic ↓ / ↑</th><th class="num">Last used</th></tr></thead>
    <tbody>${ints.map((x) => `<tr${focusRow(x)}><td><b>${esc(x.name)}</b>${x.openFailed ? `<div class="sub2 bd">${x.openFailed} failed connection${x.openFailed > 1 ? "s" : ""}</div>` : ""}</td>
      <td class="num">${fmtN(x.requests)}</td><td class="num">${fmtMs(x.response.median)}</td><td class="num">${fmtMs(x.response.p95)}</td>
      <td>${x.response.slowest ? `${fmtMs(x.response.slowest.ms)} <span class="sub2" style="display:inline">${esc(x.response.slowest.msg)}</span>` : "—"}</td>
      <td class="num">${fmtN(x.events)}</td><td class="num" title="${x.shaped ? `${x.shaped.unsubscribed} for unused devices · ${x.shaped.repeat} repeats · ${x.shaped.merged} merged while asleep (${x.shaped.held} held)${x.shaped.standby ? ` · ${x.shaped.standby} standby notices kept back` : ""}` : ""}">${x.shaped ? fmtN(x.shaped.unsubscribed + x.shaped.repeat + x.shaped.merged) : "—"}</td><td class="num">${fmtBytes(x.totals.bytesIn)} / ${fmtBytes(x.totals.bytesOut)}</td><td class="num">${x.lastActive ? ago(x.lastActive) + " ago" : "—"}</td></tr>`).join("")}</tbody></table></div>
    <p class="sub2">"Not sent" counts updates the hub kept from the remote: for devices it doesn't use, exact repeats, and ones merged while it slept (point at a number for the breakdown). "Answers in" is how long the integration takes to reply to the remote, measured on the hub. The time a button press takes is about that plus the link's round trip. Figures cover the time since the hub started.</p>` : `<p class="sub2">No integration has been used through the link yet.</p>`;

  const a = artNow, ast = a?.stats;
  const saved = ast && ast.originalBytes > 0 ? 1 - ast.sentBytes / ast.originalBytes : null;
  const artHtml = !a ? "" : `<div class="netsec"><div class="nethead" style="margin-bottom:6px"><h4>Artwork</h4><span class="sub2" style="margin:0">pictures from integrations, scaled to the remote's screen by the hub</span></div>
    <div class="toggle"><div class="t"><b>Shrink artwork for the remote</b><span>Same proportions and size on screen, never cropped or enlarged; transparent pictures stay PNG; small ones are sent as they are. The hub keeps a copy, so the second view is instant.</span></div><input type="checkbox" class="sw" id="artOn" ${a.settings.enabled ? "checked" : ""} aria-label="Shrink artwork"></div>
    <div class="field" style="margin:10px 0"><label for="artMax">Largest size</label>
      <select class="inp" id="artMax" style="max-width:340px">${[[360, "360 px (smallest files)"], [480, "480 px: the screen's width (recommended)"], [720, "720 px"], [960, "960 px (sharpest)"]].map(([v, l]) => `<option value="${v}" ${a.settings.maxPx === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <div class="help">Raise it if artwork ever looks softer than before. Changing it clears the hub's copies.</div></div>
    <div class="netgrid">
      <div class="stat"><div class="k">Pictures sent</div><div class="v">${fmtN(ast.served + ast.inline)}</div><div class="sub2">${fmtN(ast.cacheHits)} from the hub's copy</div></div>
      <div class="stat"><div class="k">Size</div><div class="v">${fmtBytes(ast.sentBytes)}</div><div class="sub2">instead of ${fmtBytes(ast.originalBytes)}</div></div>
      <div class="stat"><div class="k">Saved</div><div class="v">${saved == null ? "—" : Math.round(saved * 100) + "<small>%</small>"}</div><div class="sub2">less for the remote to download</div></div>
      <div class="stat"><div class="k">Hub's copies</div><div class="v">${fmtBytes(a.cacheBytes)}</div><div class="sub2"><a href="#" id="artClear">clear</a> · up to 300 MB</div></div>
    </div>
    ${!a.available ? '<p class="bd">The image library didn\'t load, so pictures are passed on at full size.</p>' : ""}
    ${ast.lastError ? `<p class="sub2">Last problem: ${esc(ast.lastError.message)} (${ago(ast.lastError.at)} ago). The remote then gets the original picture.</p>` : ""}</div>`;
  const keep = $("#winBody").scrollTop;
  $("#winBody").innerHTML = `
    <div class="nethead" style="margin-bottom:4px"><span class="sub2" style="margin:0">Updates every 5 seconds.</span>
      <div class="seg">${[[1, "1 h"], [6, "6 h"], [24, "24 h"]].map(([v, l]) => `<button data-hours="${v}" class="${v === hours ? "on" : ""}" aria-pressed="${v === hours}">${l}</button>`).join("")}</div></div>
    ${remotes}
    <div class="netsec"><div class="nethead" style="margin-bottom:10px"><h4>Integrations</h4></div>${table}</div>
    ${artHtml}`;
  $("#winBody").scrollTop = keep;
  const setArt = async (body) => { try { artNow = await call("PATCH", "/artwork", body); renderNetwork(); toast("Artwork setting saved"); } catch (e) { fail(e); } };
  $("#artOn") && ($("#artOn").onchange = (e) => setArt({ enabled: e.target.checked }));
  $("#artMax") && ($("#artMax").onchange = (e) => setArt({ maxPx: Number(e.target.value) }));
  $("#artClear") && ($("#artClear").onclick = async (e) => { e.preventDefault(); try { artNow = await call("POST", "/artwork/clear"); renderNetwork(); toast("Cleared the hub's copies"); } catch (err) { fail(err); } });
  $$("#winBody [data-hours]").forEach((b) => (b.onclick = () => { netState.hours = Number(b.dataset.hours); store.set("pg-net-hours", netState.hours); renderNetwork(); }));
}

/* ---------------- start ---------------- */
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
applyTheme();
refresh().then(() => { refreshNet(); refreshRes(); refreshBattery(); });
setInterval(() => { if (!document.hidden && (!win.kind || win.kind === "network")) refresh(); }, 3000);
setInterval(() => { if (!netState.open) refreshNet(); if (win.kind !== "resources") refreshRes(); refreshBattery(); }, 15000);
</script>
</body>
</html>
