# Pegasus Hub
# docker compose up -d, then open http://<server>:9600. Update: docker compose pull && docker compose up -d
# On OpenMediaVault: Services → Compose → Files → Add, paste this, and change the data folder
# (the left side of "volumes") to a folder on one of your shares. Update there with Pull, then Up.
services:
  pegasus-hub:
    image: ghcr.io/sat32blk/pegasus-hub:latest
    # build: .                         # or build it on the server: docker compose up -d --build
    container_name: pegasus-hub
    restart: unless-stopped
    # Host networking: integrations find their devices with mDNS / SSDP broadcasts, which don't
    # cross Docker's own networks. Only PEGASUS_PORT is used on the server's network; each
    # integration uses a port from 10100 up, but only on 127.0.0.1 inside the container.
    network_mode: host
    environment:
      - PEGASUS_PORT=9600              # the page (http://server:9600); remotes link here too
      - PUID=1000                      # integrations run as this user, not root (PUID=0 for root)
      - PGID=100                       # ...and this group
      - TZ=America/New_York            # your time zone, for logs and charts
      # - PEGASUS_PASSWORD=change-me   # optional login for the page (remotes use the pairing code)
      # - PEGASUS_NAME=Pegasus Hub     # name the remotes show for this hub
    volumes:
      - ./data:/data                   # integrations, their settings and logs, pairing code, history
